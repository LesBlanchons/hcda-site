backend:
  name: git-gateway
  branch: main

# ⚠️ Nécessite Netlify Identity + Git Gateway activés sur le site Netlify
# (Site settings > Identity > Enable Identity, puis Services > Git Gateway).
# C'est ce qui permet à Corentin de se connecter à /admin/ sans toucher au code.

media_folder: "public/images/blog"
public_folder: "/images/blog"

collections:
  - name: "blog"
    label: "Actualités"
    label_singular: "Article"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date de publication", name: "date", widget: "datetime" }
      - { label: "Résumé (affiché dans la liste)", name: "excerpt", widget: "text" }
      - { label: "Image de couverture", name: "cover", widget: "image", required: false }
      - { label: "Brouillon (ne pas publier)", name: "draft", widget: "boolean", default: false }
      - { label: "Contenu de l'article", name: "body", widget: "markdown" }

  - name: "parametres"
    label: "Paramètres du site"
    label_singular: "Paramètre"
    files:
      - name: "tarifs"
        label: "Tarifs (Adhésion)"
        file: "src/data/tarifs.json"
        fields:
          - label: "Tarifs"
            name: "tarifs"
            widget: "list"
            fields:
              - { label: "Catégorie", name: "categorie", widget: "string" }
              - { label: "Prix", name: "prix", widget: "string" }

      - name: "planning"
        label: "Planning hiver"
        file: "src/data/planning.json"
        fields:
          - label: "Groupes"
            name: "seances"
            widget: "list"
            fields:
              - { label: "Public", name: "public", widget: "string" }
              - { label: "Fréquence", name: "frequence", widget: "string" }
              - { label: "Durée", name: "horaire", widget: "string" }
              - { label: "Jour(s)", name: "jours", widget: "string" }
          - { label: "Note sous le tableau", name: "note", widget: "string" }

      - name: "seances_tests"
        label: "Séances tests (Événements)"
        file: "src/data/seances-tests.json"
        fields:
          - { label: "Période affichée (ex. Décembre 2026)", name: "periode", widget: "string" }
          - label: "Groupes (dates et horaires)"
            name: "groupes"
            widget: "list"
            fields:
              - { label: "Nom du groupe", name: "nom", widget: "string" }
              - { label: "Dates", name: "dates", widget: "string" }
              - { label: "Horaire", name: "horaire", widget: "string" }
          - { label: "Infos pratiques (une ligne par info)", name: "infosPratiques", widget: "list" }
          - { label: "Goûter / pot de fin de séance", name: "gouter", widget: "text" }
          - label: "Tombola"
            name: "tombola"
            widget: "object"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Texte", name: "texte", widget: "text" }
